version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aml-backend
    ports:
      - "8000:8000"
    environment:
      - COGNODB_URI=${COGNODB_URI:-bolt+s://demo.databases.cognodb.cloud}
      - COGNODB_USER=${COGNODB_USER:-cognodb}
      - COGNODB_PASSWORD=${COGNODB_PASSWORD:-demo_password}
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/overview/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aml-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
